<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collin Summers | Contact</title>
    
    <!-- Import Tailwind CSS V4 -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    
    <!-- Import a clean Google Font (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- Basic configuration to apply the font -->
    <link rel="stylesheet" href="styles.css">

    <meta name="description" content="How to get in contact with Collin Summers through Email, GitHub, or LinkedIn">

    <meta property="og:title" content="Get In Touch">
    <meta property="og:description" content="How to get in contact with Collin Summers through Email, GitHub, or LinkedIn">
    <meta property="og:image" content="img/CSlogoBanner.png">
    <meta property="og:url" content="https://skippzzmods.github.io/skippzz.github.io/contact.html">

    <link rel="icon" type="image/png" href="img/CSlogo.png">
</head>

<body class="bg-slate-900 text-slate-200 antialiased selection:bg-indigo-500 selection:text-white">
    <header>
        <nav class="bg-slate-700 flex flex-wrap justify-center gap-x-4 md:gap-x-8 px-4 md:px-16 py-4 md:py-6">
            <a href="contact.html" aria-current="page" class="text-base md:text-2xl font-bold text-white transition duration-150 hover:text-indigo-400 hover:scale-105 hover:shadow-md">Contact</a>
            <a href="index.html" class="text-base md:text-2xl text-slate-400 transition duration-150 hover:text-indigo-400 hover:scale-105 hover:shadow-md">Home</a>
            <a href="spirit.html" class="text-base md:text-2xl text-slate-400 transition duration-150 hover:text-indigo-400 hover:scale-105 hover:shadow-md">Spirit Reforged</a>
            <a href="starlight.html" class="text-base md:text-2xl text-slate-400 transition duration-150 hover:text-indigo-400 hover:scale-105 hover:shadow-md">Starlight River</a>
        </nav>
    </header>

    <main>
        <section id="summary" class="max-w-4xl mx-auto px-6 py-20 flex flex-col items-center text-center mb-80 pre-animate">
            <h1 class="text-5xl md:text-9xl font-bold text-white">
            Get In Touch!
            </h1>

            <h2 class="text-2xl italic text-slate-400 mb-4">
                skippzzofficial@gmail.com
            </h2>

            <article class="max-w-5xl flex justify-center gap-x-12">
                <a href="mailto:skippzzofficial@gmail.com" class="text-xl text-slate-400 underline transition duration-50 hover:text-indigo-400">Email Me!</a>
                <a href="https://github.com/SkippZzMods" class="text-xl text-slate-400 underline transition duration-50 hover:text-indigo-400">GitHub</a>
                <a href="https://www.linkedin.com/in/collin-summers/" class="text-xl text-slate-400 underline transition duration-50 hover:text-indigo-400">LinkedIn</a>
            </article>
        </section>
    </main>

    <footer>
        <p class="text-2xl italic text-slate-400 mb-4 text-center pre-animate">
            Thank you for your consideration
        </p>
    </footer>

    <script>
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add('animate-in');
            }
            });
        });

        document.querySelectorAll('.pre-animate').forEach(el => observer.observe(el));
    </script>
</body>
</html>
